name: hw01-golden-signals

# Оба пода запускаются из одного образа: собирает его app-1, app-2 только использует.
x-app: &app
  image: hw01-items-service:local
  environment: &app-env
    FAIL_RATE: ${FAIL_RATE:-0.03}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 12
  restart: unless-stopped

services:
  app-1:
    <<: *app
    build: ./app
    environment:
      <<: *app-env
      POD_ID: pod-1
      DATACENTER: dc-msk
    ports: ["127.0.0.1:8081:8080"]

  app-2:
    <<: *app
    pull_policy: never
    environment:
      <<: *app-env
      POD_ID: pod-2
      DATACENTER: dc-spb
    ports: ["127.0.0.1:8082:8080"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on:
      app-1: {condition: service_healthy}
      app-2: {condition: service_healthy}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?run cp .env.example .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run cp .env.example .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on: [prometheus]
    restart: unless-stopped

  # TODO(этап 4): dashboard-generator
  #   depends_on: app-1/app-2/grafana -> condition: service_healthy
  #   environment: GRAFANA_URL, GRAFANA_ADMIN_USER/PASSWORD из .env, APP_URL
  #   restart: "no"

  # TODO(этап 5): load-generator
  #   depends_on: app-* -> service_healthy, dashboard-generator -> service_completed_successfully

volumes:
  prometheus-data:
  grafana-data:
