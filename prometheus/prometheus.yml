global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 15s

scrape_configs:
  # Лейблы пода и датацентра приложение добавляет в сами метрики
  # (из env-переменных POD_ID и DATACENTER), поэтому здесь их не дублируем.
  - job_name: items-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - app1:8080
          - app2:8080
