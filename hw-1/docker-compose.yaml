x-app: &app
  build:
    context: .
    dockerfile: app/Dockerfile
  image: hw1-app:local
  restart: unless-stopped

x-app-env: &app-env
  FAULT_PROBABILITY: ${FAULT_PROBABILITY:-0.03}

services:
  app-dc1:
    <<: *app
    environment:
      <<: *app-env
      POD_ID: pod-1
      DATACENTER: dc-1
    ports:
      - "8081:8080"

  app-dc2:
    <<: *app
    environment:
      <<: *app-env
      POD_ID: pod-2
      DATACENTER: dc-2
    ports:
      - "8082:8080"

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
