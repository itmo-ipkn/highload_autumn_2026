name: ddia-hw-1

x-app: &app
  build:
    context: .
    target: app
  image: ddia-hw-1/app:local
  restart: unless-stopped
  environment: &app-env
    FAIL_RATE: ${FAIL_RATE:-0.02}
    MAX_DELAY: 50ms
  healthcheck:
    test: ["CMD", "/app", "-healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 5

services:
  app-1:
    <<: *app
    environment:
      <<: *app-env
      POD_ID: pod-1
      DATACENTER: dc-a
    ports:
      - "8081:8080"

  app-2:
    <<: *app
    environment:
      <<: *app-env
      POD_ID: pod-2
      DATACENTER: dc-b
    ports:
      - "8082:8080"

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  dashgen:
    build:
      context: .
      target: dashgen
    image: ddia-hw-1/dashgen:local
    restart: "no"
    environment:
      APP_URLS: http://app-1:8080,http://app-2:8080
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GRAFANA_VIEWER_USER: ${GRAFANA_VIEWER_USER:?set in .env}
      GRAFANA_VIEWER_PASSWORD: ${GRAFANA_VIEWER_PASSWORD:?set in .env}
      DATASOURCE_UID: prometheus
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      grafana:
        condition: service_healthy

  load:
    image: grafana/k6:2.3.0
    command: ["run", "--quiet", "--summary-mode=disabled", "/scripts/load.js"]
    environment:
      TARGETS: http://app-1:8080,http://app-2:8080
      RATE: ${LOAD_RATE:-30}
      RAMP: ${LOAD_RAMP:-3m}
    volumes:
      - ./load:/scripts:ro
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      dashgen:
        condition: service_completed_successfully
