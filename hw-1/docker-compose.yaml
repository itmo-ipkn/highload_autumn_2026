name: highload-hw1

x-app: &app
  build: .
  image: highload-hw1-app:local
  healthcheck:
    test: ["CMD", "/items-api", "-healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 5

services:
  app-1:
    <<: *app
    environment:
      POD_ID: pod-1
      DATACENTER: dc-a
    ports:
      - "127.0.0.1:${APP1_PORT:-18081}:8080"

  app-2:
    <<: *app
    environment:
      POD_ID: pod-2
      DATACENTER: dc-b
    ports:
      - "127.0.0.1:${APP2_PORT:-18082}:8080"

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Скопируйте .env.example в .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Задайте пароль в .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  dashboard:
    build:
      context: .
      target: dashboard
    image: highload-hw1-dashboard:local
    restart: "no"
    environment:
      APP_URLS: http://app-1:8080,http://app-2:8080
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Скопируйте .env.example в .env}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Задайте пароль в .env}
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      grafana:
        condition: service_healthy

  load:
    build:
      context: .
      target: load
    image: highload-hw1-load:local
    environment:
      APP_URLS: http://app-1:8080,http://app-2:8080
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      dashboard:
        condition: service_completed_successfully

volumes:
  prometheus-data:
  grafana-data:
