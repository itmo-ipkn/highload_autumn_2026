apiVersion: 1

datasources:
  - name: Task1 Prometheus
    uid: task1-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    version: 1
    jsonData:
      httpMethod: POST
      timeInterval: 5s

# editable: false here locks only the datasource.
# The generator separately marks the dashboard non-editable.
