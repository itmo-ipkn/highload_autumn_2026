global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

scrape_configs:
  - job_name: items-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - app1:8000
          - app2:8000

# POD_ID and DATACENTER are provided to the apps as environment variables;
# the instrumentation library exports them as metric labels.
