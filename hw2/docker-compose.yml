x-kafka-common: &kafka-common
  image: apache/kafka:4.1.2
  environment: &kafka-env
    KAFKA_PROCESS_ROLES: broker,controller

    KAFKA_CONTROLLER_QUORUM_VOTERS: >-
      1@kafka-1:9093,
      2@kafka-2:9093,
      3@kafka-3:9093

    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
      INTERNAL:PLAINTEXT,
      EXTERNAL:PLAINTEXT,
      CONTROLLER:PLAINTEXT

    KAFKA_LISTENERS: >-
      INTERNAL://:19092,
      EXTERNAL://:9092,
      CONTROLLER://:9093

    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    KAFKA_LOG_DIRS: /var/lib/kafka/data
    CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

x-producer-common: &producer-common
  build:
    context: ./producer
    dockerfile: Dockerfile

  image: producer:1.0.0
  restart: unless-stopped

  stop_signal: SIGTERM
  stop_grace_period: 180s

  depends_on:
    kafka-init:
      condition: service_completed_successfully

  environment: &producer-env
    SERVICE_PORT: 8080
    BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
    KAFKA_EVENT_TOPIC: events
    KAFKA_RATE: ${KAFKA_RATE:-100}
    KEY_MODE: ${KEY_MODE:-user_id}

x-consumer-common: &consumer-common
  build:
    context: ./consumer
  image: consumer:1.0.0
  restart: unless-stopped
  stop_grace_period: 60s
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    db:
      condition: service_healthy

services:
  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    ports:
      - "29092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka-1:19092,
        EXTERNAL://localhost:29092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    ports:
      - "39092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka-2:19092,
        EXTERNAL://localhost:39092
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    ports:
      - "49092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka-3:19092,
        EXTERNAL://localhost:49092
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        BOOTSTRAP_SERVERS="kafka-1:19092,kafka-2:19092,kafka-3:19092"

        echo "Waiting for Kafka cluster..."

        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server "$$BOOTSTRAP_SERVERS" \
          --list > /dev/null 2>&1; do
          echo "Kafka is not ready yet..."
          sleep 3
        done

        echo "Creating events topic..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server "$$BOOTSTRAP_SERVERS" \
          --create \
          --if-not-exists \
          --topic events \
          --partitions 3 \
          --replication-factor 3 \
          --config min.insync.replicas=2

        echo "Creating events.dlt topic..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server "$$BOOTSTRAP_SERVERS" \
          --create \
          --if-not-exists \
          --topic events.dlt \
          --partitions 3 \
          --replication-factor 3

        echo "Kafka topics initialized successfully."
    restart: "no"

  producer-1:
    <<: *producer-common
    hostname: producer-1
    environment:
      <<: *producer-env
      USER_MIN_ID: 1
      USER_MAX_ID: 100

  producer-2:
    <<: *producer-common
    hostname: producer-2
    environment:
      <<: *producer-env
      USER_MIN_ID: 101
      USER_MAX_ID: 200

  producer-3:
    <<: *producer-common
    hostname: producer-3
    environment:
      <<: *producer-env
      USER_MIN_ID: 201
      USER_MAX_ID: 300

  consumer-1:
    <<: *consumer-common
    environment:
      POD_ID: 1
      PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-10}

  consumer-2:
    <<: *consumer-common
    environment:
      POD_ID: 2
      PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-10}

  consumer-3:
    <<: *consumer-common
    environment:
      POD_ID: 3
      PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-10}

  db:
    image: postgres:17-alpine
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "consumer", "-d", "consumer_db"]
      interval: 2s
      timeout: 3s
      retries: 20
    environment:
      POSTGRES_DB: consumer_db
      POSTGRES_USER: consumer
      POSTGRES_PASSWORD: consumer
    ports:
      - 35432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data


  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.11.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --kafka.server=kafka-1:19092
      - --kafka.server=kafka-2:19092
      - --kafka.server=kafka-3:19092
      - --kafka.version=4.1.2
      - --topic.filter=^events([.]dlt)?$
      - --group.filter=^events-processor$
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: [kafka-exporter]

  grafana:
    image: grafana/grafana:12.2.0
    profiles: [monitoring]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  pgdata:
  prometheus-data:
  grafana-data:
