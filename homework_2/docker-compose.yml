x-kafka: &kafka
  image: apache/kafka:4.4.0
  restart: always
  healthcheck:
    test: ["CMD", "/opt/kafka/bin/kafka-cluster.sh", "api-versions", "--bootstrap-server", "localhost:9092"]
    interval: 10s
    timeout: 10s
    retries: 18
    start_period: 20s
  networks:
    - kafka_network

x-kafka-env: &kafka-env
  CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
  KAFKA_PROCESS_ROLES: 'broker,controller'
  KAFKA_CONTROLLER_QUORUM_VOTERS: '0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093'
  KAFKA_LISTENERS: 'BROKER://:9092,CONTROLLER://:9093,CLIENT://:9094'
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT,CLIENT:PLAINTEXT'
  KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
  KAFKA_INTER_BROKER_LISTENER_NAME: 'BROKER'
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m

services:
  kafka-0:
    <<: *kafka
    container_name: kafka_broker_0
    hostname: kafka-0
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 0
      KAFKA_ADVERTISED_LISTENERS: 'BROKER://kafka-0:9092,CONTROLLER://kafka-0:9093,CLIENT://127.0.0.1:9094'
    volumes:
      - kafka_0_data:/var/lib/kafka/data

  kafka-1:
    <<: *kafka
    container_name: kafka_broker_1
    hostname: kafka-1
    ports:
      - "9095:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'BROKER://kafka-1:9092,CONTROLLER://kafka-1:9093,CLIENT://127.0.0.1:9095'
    volumes:
      - kafka_1_data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka
    container_name: kafka_broker_2
    hostname: kafka-2
    ports:
      - "9096:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: 'BROKER://kafka-2:9092,CONTROLLER://kafka-2:9093,CLIENT://127.0.0.1:9096'
    volumes:
      - kafka_2_data:/var/lib/kafka/data

  kafbat-ui:
    image: kafbat/kafka-ui:a0aaba3
    container_name: kafbat-ui
    restart: always
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-0:9092,kafka-1:9092,kafka-2:9092
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    networks:
      - kafka_network

  kafka_topic_creator:
    image: apache/kafka:4.4.0
    container_name: kafka_topic_creator
    restart: on-failure:3
    depends_on:
      - kafka-0
      - kafka-1
      - kafka-2
    networks:
      - kafka_network
    volumes:
      - ./infra/kafka_topic_creator_entrypoint.sh:/var/kafka_topic_creator_entrypoint.sh
    entrypoint: /var/kafka_topic_creator_entrypoint.sh

  postgres:
    image: postgres:19.0
    container_name: postgres
    restart: always
    env_file:
      - postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - postgres_network

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    container_name: pgbouncer
    restart: always
    env_file:
      - pgbouncer.env
    # expose:
    #   - "5432"
    ports:
      - "5432:5432"
    depends_on:
      - postgres
    networks:
      - postgres_network

volumes:
  kafka_0_data:
  kafka_1_data:
  kafka_2_data:
  postgres_data:

networks:
  kafka_network: null
  postgres_network: null
