name: highload-java

services:
  app1:
    image: highload-items-service:1.0.0
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POD_ID: pod-1
      DATACENTER: dc-1
      FAILURE_RATE: ${FAILURE_RATE:-0.05}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [monitoring]

  app2:
    image: highload-items-service:1.0.0
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POD_ID: pod-2
      DATACENTER: dc-2
      FAILURE_RATE: ${FAILURE_RATE:-0.05}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      app1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [monitoring]

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [monitoring]

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Copy .env.example to .env and set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped
    networks: [monitoring]

  dashboard-generator:
    image: python:3.13-slim
    environment:
      APP_URL: http://app1:8080
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Copy .env.example to .env and set GRAFANA_ADMIN_PASSWORD}
      PROMETHEUS_DS_UID: prometheus
    volumes:
      - ./scripts:/scripts:ro
    command: ["python", "/scripts/generate_dashboard.py"]
    depends_on:
      app1:
        condition: service_healthy
      grafana:
        condition: service_healthy
    restart: "no"
    networks: [monitoring]

  load:
    image: grafana/k6:1.3.0
    environment:
      APP1_URL: http://app1:8080
      APP2_URL: http://app2:8080
      TARGET_RPS_PER_POD: ${TARGET_RPS_PER_POD:-25}
    volumes:
      - ./load:/load:ro
    command: ["run", "/load/test.js"]
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      dashboard-generator:
        condition: service_completed_successfully
    restart: "no"
    networks: [monitoring]

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
    driver: bridge
