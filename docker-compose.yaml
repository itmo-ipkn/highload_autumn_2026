# HW2: Kafka (KRaft, 3 controllers + 3 brokers), producers, consumers, Postgres sink,
# Prometheus + Grafana for observing the experiments.
#
#   docker compose up -d --build
#   docker compose run --rm verify
#
# Brokers are reachable from the host on localhost:29092,29093,29094
# and inside the compose network on kafka-1:19092,kafka-2:19092,kafka-3:19092.

x-kafka-common: &kafka-common
  image: apache/kafka:4.1.0
  restart: unless-stopped

x-controller-env: &controller-env
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
  KAFKA_PROCESS_ROLES: controller
  KAFKA_LISTENERS: CONTROLLER://:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
  KAFKA_LOG_DIRS: /tmp/kraft-controller-logs
  KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"

x-broker-env: &broker-env
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
  KAFKA_PROCESS_ROLES: broker
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LOG_DIRS: /tmp/kraft-broker-logs
  KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
  # topics are created only by the kafka-init service
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 1000

x-broker-healthcheck: &broker-healthcheck
  test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
  interval: 10s
  timeout: 20s
  retries: 12
  start_period: 15s

x-app: &app
  build: ./app
  image: hw2-kafka-app
  restart: unless-stopped
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy

x-app-env: &app-env
  KAFKA_BOOTSTRAP: kafka-1:19092,kafka-2:19092,kafka-3:19092
  PG_DSN: postgresql://hw2:hw2@postgres:5432/hw2
  PYTHONUNBUFFERED: "1"

x-producer-env: &producer-env
  <<: *app-env
  TOPIC: events
  RATE_PER_SEC: ${RATE_PER_SEC:-30}
  USERS_PER_POD: ${USERS_PER_POD:-10}
  POISON_RATE: ${POISON_RATE:-0.02}
  KEY_MODE: ${KEY_MODE:-user_id}

x-consumer-env: &consumer-env
  <<: *app-env
  TOPIC: events
  DLT_TOPIC: events.dlt
  GROUP_ID: events-processor
  PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-5}
  MAX_ATTEMPTS: 3

services:
  # ---------------------------------------------------------------- Kafka (KRaft)
  controller-1:
    <<: *kafka-common
    hostname: controller-1
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 1
  controller-2:
    <<: *kafka-common
    hostname: controller-2
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 2
  controller-3:
    <<: *kafka-common
    hostname: controller-3
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 3

  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    depends_on: [controller-1, controller-2, controller-3]
    ports: ["29092:29092"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 4
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:29092
    healthcheck: *broker-healthcheck
  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    depends_on: [controller-1, controller-2, controller-3]
    ports: ["29093:29093"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 5
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:29093
    healthcheck: *broker-healthcheck
  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    depends_on: [controller-1, controller-2, controller-3]
    ports: ["29094:29094"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 6
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:29094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:29094
    healthcheck: *broker-healthcheck

  # one-shot topic creation (auto.create.topics.enable=false)
  kafka-init:
    image: apache/kafka:4.1.0
    restart: "no"
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        BS=kafka-1:19092,kafka-2:19092,kafka-3:19092
        T=/opt/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server $$BS --create --if-not-exists --topic events \
            --partitions 3 --replication-factor 3 --config min.insync.replicas=2
        $$T --bootstrap-server $$BS --create --if-not-exists --topic events.dlt \
            --partitions 3 --replication-factor 3 --config min.insync.replicas=2
        $$T --bootstrap-server $$BS --describe --topic events
        $$T --bootstrap-server $$BS --describe --topic events.dlt

  # ---------------------------------------------------------------- sink
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hw2
      POSTGRES_PASSWORD: hw2
      POSTGRES_DB: hw2
    ports: ["55432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hw2 -d hw2"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------- producers
  producer-1:
    <<: *app
    command: ["python", "producer.py"]
    stop_grace_period: 60s
    environment: {<<: *producer-env, POD_ID: producer-1}
  producer-2:
    <<: *app
    command: ["python", "producer.py"]
    stop_grace_period: 60s
    environment: {<<: *producer-env, POD_ID: producer-2}
  producer-3:
    <<: *app
    command: ["python", "producer.py"]
    stop_grace_period: 60s
    environment: {<<: *producer-env, POD_ID: producer-3}

  # ---------------------------------------------------------------- consumers (group events-processor)
  consumer-1:
    <<: *app
    command: ["python", "consumer.py"]
    environment: {<<: *consumer-env, POD_ID: consumer-1}
  consumer-2:
    <<: *app
    command: ["python", "consumer.py"]
    environment: {<<: *consumer-env, POD_ID: consumer-2}
  consumer-3:
    <<: *app
    command: ["python", "consumer.py"]
    environment: {<<: *consumer-env, POD_ID: consumer-3}

  # ---------------------------------------------------------------- verify (CLI, run on demand)
  verify:
    build: ./app
    image: hw2-kafka-app
    profiles: ["tools"]
    restart: "no"
    command: ["python", "verify.py"]
    environment:
      <<: *app-env
      GITHUB_LOGIN: ${GITHUB_LOGIN:-unknown}
      TZ: Europe/Moscow
    depends_on:
      postgres: {condition: service_healthy}

  # ---------------------------------------------------------------- monitoring
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    depends_on: [prometheus, postgres]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kafka.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  # headless chromium used by Grafana to export panels as PNG (for README screenshots)
  renderer:
    image: grafana/grafana-image-renderer:latest
    restart: unless-stopped

volumes:
  pgdata:
