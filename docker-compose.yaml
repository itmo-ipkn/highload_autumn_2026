x-kafka-env: &kafka-env
  CLUSTER_ID: EZaM_RNtRLqE5gKVwWtlxw
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m

services:
  kafka-1:
    image: apache/kafka:4.4.0
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092
    ports:
      - "19092:9094"
    volumes:
      - kafka-1-data:/tmp/kraft-combined-logs

  kafka-2:
    image: apache/kafka:4.4.0
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:19093
    ports:
      - "19093:9094"
    volumes:
      - kafka-2-data:/tmp/kraft-combined-logs

  kafka-3:
    image: apache/kafka:4.4.0
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:19094
    ports:
      - "19094:9094"
    volumes:
      - kafka-3-data:/tmp/kraft-combined-logs

  topics-init:
    image: apache/kafka:4.4.0
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    entrypoint: ["/bin/bash", "-ec"]
    command: |
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 --create --if-not-exists --topic events --partitions 3 --replication-factor 3 --config min.insync.replicas=2; do
        echo 'Waiting for all Kafka brokers...'
        sleep 2
      done
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 --create --if-not-exists --topic events.dlt --partitions 3 --replication-factor 3; do
        echo 'Waiting to create events.dlt...'
        sleep 2
      done

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
