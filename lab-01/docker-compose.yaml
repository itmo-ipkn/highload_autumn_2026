# name: sem3-highload-lab1

volumes:
  prometheus_data:
  grafana_data:

secrets:
  grafana_password:
    environment: GRAFANA_PASSWORD

services:
  app1:
    build:
      context: .
    image: crud-vault:v1
    init: true
    restart: "no"
    environment:
      POD_ID: "${POD_ID:-pod-1}"
      DATACENTER: "${DATACENTER:-ru-1}"
    ports:
      - "${APP_PORT1:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app2:
    build:
      context: .
    image: crud-vault:v1
    init: true
    restart: "no"
    environment:
      POD_ID: "${POD_ID:-pod-2}"
      DATACENTER: "${DATACENTER:-eu-1}"
    ports:
      - "${APP_PORT2:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: "no"
    volumes:
      - ./prometheus/config.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROM_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  grafana:
    image: grafana/grafana:13.3.0
    restart: "no"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/config.ini:/etc/grafana/grafana.ini:ro
      - grafana_data:/var/lib/grafana
    secrets:
      - grafana_password
    ports:
      - "${GRAF_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  dashboard-generator:
    image: python:3.14-slim
    restart: "no"
    working_dir: /work
    volumes:
      - ./tools:/work/tools:ro
      - ./grafana/provisioning:/work/grafana/provisioning
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      grafana:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    environment:
      - APP1_BASE_URL=http://app1:8080
      - APP2_BASE_URL=http://app2:8080
    command: python ./tools/dashboard_generator.py

  k6:
    image: grafana/k6:2.3.0
    restart: "no"
    volumes:
      - ./load_tests:/scripts:ro
    command: run /scripts/test_01_baseline.js
    environment:
      - APP1_BASE_URL=http://app1:8080
      - APP2_BASE_URL=http://app2:8080
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      dashboard-generator:
        condition: service_completed_successfully
