x-app: &app
  build: .
  image: app:1.0
  healthcheck:
    test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || exit 1" ]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 20s

services:
  app-1:
    <<: *app
    ports:
      - "8081:8080"
    environment:
      POD_ID: pod-1
      DATACENTER: dc-1

  app-2:
    <<: *app
    ports:
      - "8082:8080"
    environment:
      POD_ID: pod-2
      DATACENTER: dc-2

  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy

  dashboard-gen:
    build: ./dashboard
    image: dashboard-gen
    environment:
      APP_URL: http://app-1:8080
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      grafana:
        condition: service_healthy
    restart: "no"