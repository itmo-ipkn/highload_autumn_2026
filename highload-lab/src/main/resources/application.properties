spring.application.name=highload-lab

simulation.error-probability=${SIMULATION_ERROR_PROBABILITY:0.05}
simulation.min-delay-ms=${SIMULATION_MIN_DELAY_MS:20}
simulation.max-delay-ms=${SIMULATION_MAX_DELAY_MS:200}

management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoint.health.probes.enabled=true

management.metrics.tags.pod_id=${POD_ID:local}
management.metrics.tags.datacenter=${DATACENTER:local}

management.metrics.distribution.percentiles-histogram.http.server.requests=true
