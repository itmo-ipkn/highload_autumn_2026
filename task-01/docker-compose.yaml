services:
  crud-service-dc1:
    build: .
    container_name: crud-service-dc1
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=${PORT_DC1}
      - POD_ID=${POD_ID_DC1}
      - DATACENTER=${DATACENTER_DC1}
    networks:
      app-net:
        aliases:
          - crud-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  crud-service-dc2:
    build: .
    container_name: crud-service-dc2
    ports:
      - "3002:3001"
    environment:
      - NODE_ENV=production
      - PORT=${PORT_DC2}
      - POD_ID=${POD_ID_DC2}
      - DATACENTER=${DATACENTER_DC2}
    networks:
      app-net:
        aliases:
          - crud-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app-net
    depends_on:
      crud-service-dc1:
        condition: service_started
      crud-service-dc2:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.3
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Отключаем возможность редактирования, чтобы дашборды были non-editable
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - app-net

  dashboard-generator:
    build:
      context: .
      dockerfile: Dockerfile-generator
    container_name: dashboard-generator
    environment:
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_USER=admin
      - GRAFANA_PASS=admin
    restart: "no"
    depends_on:
      grafana:
        condition: service_started
      crud-service-dc1:
        condition: service_started
      crud-service-dc2:
        condition: service_started
    networks:
      - app-net

  load-generator:
    image: ghcr.io/grafana/k6:1.3.0
    command: run --vus 40 --duration 4h load.js
    env_file:
      - .env
    environment:
      - TARGET_URL=http://crud-service:3001
    volumes:
      - ./scripts:/scripts
    working_dir: /scripts
    depends_on:
      crud-service-dc1:
        condition: service_started
      crud-service-dc2:
        condition: service_started
      dashboard-generator:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-net


volumes:
  prometheus_data:
  grafana_data:

networks:
  app-net:
    driver: bridge
