x-app-base: &app-base
  build: .
  image: highload-task-01-api:local
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "require('node:http').get('http://127.0.0.1:8080/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
    interval: 5s
    timeout: 3s
    retries: 5

services:
  app:
    <<: *app-base
    environment:
      PORT: "8080"
      POD_ID: ${POD_ID:-pod-1}
      DATACENTER: ${DATACENTER:-dc-a}
      DEMO_FAILURES: "1"
    ports:
      - "${PORT:-8080}:8080"
  app-b:
    <<: *app-base
    environment:
      PORT: "8080"
      POD_ID: ${POD_ID_2:-pod-2}
      DATACENTER: ${DATACENTER_2:-dc-b}
      DEMO_FAILURES: "1"
    ports:
      - "${PORT_2:-8081}:8080"
  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      app:
        condition: service_healthy
      app-b:
        condition: service_healthy
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
  grafana:
    image: grafana/grafana:12.2.0
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Copy .env.example to .env and set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3000/api/health
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
  dashboard-generator:
    build: .
    image: highload-task-01-api:local
    command: ["node", "scripts/generate-dashboard.mjs"]
    environment:
      APP_URL: http://app:8080
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Copy .env.example to .env and set GRAFANA_ADMIN_PASSWORD}
    depends_on:
      app:
        condition: service_healthy
      app-b:
        condition: service_healthy
      grafana:
        condition: service_healthy
    restart: "no"
  load-generator:
    build: .
    image: highload-task-01-api:local
    command: ["node", "scripts/load.mjs"]
    environment:
      APP_URLS: http://app:8080,http://app-b:8080
      LOAD_TARGET_RPS: ${LOAD_TARGET_RPS:-30}
      LOAD_RAMP_SECONDS: ${LOAD_RAMP_SECONDS:-120}
      LOAD_404_RATE: ${LOAD_404_RATE:-0.03}
      LOAD_500_RATE: ${LOAD_500_RATE:-0.02}
    depends_on:
      app:
        condition: service_healthy
      app-b:
        condition: service_healthy
      dashboard-generator:
        condition: service_completed_successfully
    restart: "unless-stopped"

volumes:
  prometheus-data:
  grafana-data:
