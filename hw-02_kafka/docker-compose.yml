x-kafka: &kafka
  image: apache/kafka:4.1.2
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 18
    start_period: 20s

x-producer: &producer
  build: .
  image: events-app
  restart: "no"
  stop_grace_period: 30s
  depends_on:
    kafka-init: { condition: service_completed_successfully }

x-consumer: &consumer
  build: .
  image: events-app
  command: ["ConsumerApp"]
  restart: "no"
  stop_grace_period: 30s
  depends_on:
    kafka-init: { condition: service_completed_successfully }
    postgres:   { condition: service_healthy }

x-kafka-env: &kafka-env
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
  KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LOG_DIRS: "/var/lib/kafka/data"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

x-producer-env: &producer-env
  BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19092,kafka-3:19092"
  TOPIC: "events"
  POD_COUNT: 3
  TOTAL_USERS: "${TOTAL_USERS:-1000}"
  RATE_PER_SEC: "${RATE_PER_SEC:-200}"
  POISON_RATE: 0.02
  KEY_MODE: "${KEY_MODE:-user_id}"
  DELIVERY_TIMEOUT_MS: "${DELIVERY_TIMEOUT_MS:-20000}"
  REQUEST_TIMEOUT_MS: "${REQUEST_TIMEOUT_MS:-5000}"
  MAX_BLOCK_MS: "${MAX_BLOCK_MS:-10000}"

x-consumer-env: &consumer-env
  BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19092,kafka-3:19092"
  TOPIC: "events"
  DLT_TOPIC: "events.dlt"
  GROUP_ID: "events-processor"
  PROCESSING_DELAY_MS: "${PROCESSING_DELAY_MS:-10}"
  MAX_ATTEMPTS: 3
  DB_URL: "jdbc:postgresql://postgres:5432/sink"
  DB_USER: "sink"
  DB_PASSWORD: "sink"

services:
  kafka-1:
    <<: *kafka
    container_name: kafka-1
    hostname: kafka-1
    ports: ["29092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:19092,EXTERNAL://localhost:29092"
    volumes: ["kafka-1-data:/var/lib/kafka/data"]

  kafka-2:
    <<: *kafka
    container_name: kafka-2
    hostname: kafka-2
    ports: ["29093:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:19092,EXTERNAL://localhost:29093"
    volumes: ["kafka-2-data:/var/lib/kafka/data"]

  kafka-3:
    <<: *kafka
    container_name: kafka-3
    hostname: kafka-3
    ports: ["29094:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:19092,EXTERNAL://localhost:29094"
    volumes: ["kafka-3-data:/var/lib/kafka/data"]

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    restart: "no"
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BS=kafka-1:19092,kafka-2:19092,kafka-3:19092
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
          --topic events --partitions 3 --replication-factor 3 \
          --config min.insync.replicas=2 --config unclean.leader.election.enable=false
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
          --topic events.dlt --partitions 3 --replication-factor 3 \
          --config unclean.leader.election.enable=false
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BS --describe

  producer-0:
    <<: *producer
    container_name: producer-0
    environment: { <<: *producer-env, POD_INDEX: 0 }
  producer-1:
    <<: *producer
    container_name: producer-1
    environment: { <<: *producer-env, POD_INDEX: 1 }
  producer-2:
    <<: *producer
    container_name: producer-2
    environment: { <<: *producer-env, POD_INDEX: 2 }

  consumer-0:
    <<: *consumer
    container_name: consumer-0
    environment: { <<: *consumer-env, POD_INDEX: 0 }
  consumer-1:
    <<: *consumer
    container_name: consumer-1
    environment: { <<: *consumer-env, POD_INDEX: 1 }
  consumer-2:
    <<: *consumer
    container_name: consumer-2
    environment: { <<: *consumer-env, POD_INDEX: 2 }

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: "sink"
      POSTGRES_PASSWORD: "sink"
      POSTGRES_DB: "sink"
    ports: [ "127.0.0.1:15432:5432" ]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sink -d sink" ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  pg-data: