global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: kafka-exporter
    static_configs:
      # danielqsj/kafka-exporter listens on :9308 by default.
      - targets: ["kafka-exporter:9308"]

  # Producer/consumer pods expose prometheus_client counters on :9404.
  - job_name: app
    static_configs:
      - targets:
          - producer1:9404
          - producer2:9404
          - producer3:9404
          - consumer1:9404
          - consumer2:9404
          - consumer3:9404
