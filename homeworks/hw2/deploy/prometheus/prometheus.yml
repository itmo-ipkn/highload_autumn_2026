global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: producers
    static_configs:
      - targets: [producer-1:2112, producer-2:2112, producer-3:2112]

  - job_name: consumers
    static_configs:
      - targets: [consumer-1:2113, consumer-2:2113, consumer-3:2113]

  - job_name: kafka-exporter
    static_configs:
      - targets: [kafka-exporter:9308]
