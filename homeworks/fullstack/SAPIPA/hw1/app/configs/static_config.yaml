components_manager:
    coro_pool:
        stack_usage_monitor_enabled: false

    task_processors:

        main-task-processor:
            worker_threads: $worker-threads

        fs-task-processor:
            worker_threads: $worker-fs-threads

        monitor-task-processor:
            worker_threads: 1
            thread_name: mon-worker

    default_task_processor: main-task-processor

    components:
        server:
            middleware-pipeline-builder: monitoring-pipeline-builder
            listener:
                port: $server-port
                task_processor: main-task-processor

            listener-monitor:
                port: 8081
                task_processor: monitor-task-processor

        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    overflow_behavior: discard

        dynamic-config:
            defaults:
                HTTP_CLIENT_CONNECTION_POOL_SIZE: 1000

        testsuite-support: {}

        congestion-control:

        http-client:
        http-client-core:
            fs-task-processor: fs-task-processor

        dns-client:
            fs-task-processor: fs-task-processor

        tests-control:
            load-enabled: $is-testing
            path: /tests/{action}
            method: POST
            task_processor: main-task-processor

        handler-health:
            path: /health
            method: GET
            task_processor: main-task-processor

        item-storage: {}

        handler-create-item:
            path: /items
            method: POST
            task_processor: main-task-processor

        handler-get-item:
            path: /items/{id}
            method: GET
            task_processor: main-task-processor

        handler-update-item:
            path: /items/{id}
            method: PUT
            task_processor: main-task-processor

        handler-handlers:
            path: /handlers
            method: GET
            task_processor: main-task-processor

        handler-server-monitor:
            path: /metrics
            method: GET
            task_processor: monitor-task-processor
            format: prometheus
            common-labels:
                pod_id: $pod-id
                pod_id#env: POD_ID
                pod_id#fallback: local

                datacenter: $datacenter
                datacenter#env: DATACENTER
                datacenter#fallback: local

        latency-metrics: {}

        latency-middleware: {}

        monitoring-pipeline-builder: {}
