apiVersion: 1
datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 2s
  - name: Sink
    uid: sink
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: hw2
    jsonData:
      database: hw2
      sslmode: disable
    secureJsonData:
      password: hw2
