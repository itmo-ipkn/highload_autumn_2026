services:
  items-1:
    image: items-service:local
    build:
      context: .
      target: items
    environment:
      POD_ID: items-1
      DATACENTER: dc-a
      INJECT_500_PROBABILITY: "0.05"
    ports:
      - "8080:8080"

  items-2:
    image: items-service:local
    pull_policy: never
    environment:
      POD_ID: items-2
      DATACENTER: dc-b
      INJECT_500_PROBABILITY: "0.05"

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      items-1:
        condition: service_healthy
      items-2:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.4.13
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      prometheus:
        condition: service_started

  dashboard-generator:
    build:
      context: .
      target: dashboard-generator
    environment:
      ITEMS_URL: http://items-1:8080
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    depends_on:
      items-1:
        condition: service_healthy
      grafana:
        condition: service_healthy

  load-generator:
    image: items-load-generator:local
    build:
      context: .
      target: load-generator
    environment:
      ITEMS_URLS: http://items-1:8080,http://items-2:8080
    depends_on:
      items-1:
        condition: service_healthy
      items-2:
        condition: service_healthy
      dashboard-generator:
        condition: service_completed_successfully

volumes:
  prometheus-data:
  grafana-data:
