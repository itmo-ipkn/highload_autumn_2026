name: ddia-hw2

x-kafka: &kafka
  image: apache/kafka:3.9.1

x-kafka-environment: &kafka-environment
  CLUSTER_ID: kAdYYKo-QxmOyeueqvU4lA
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"

x-app-environment: &app-environment
  KAFKA_BOOTSTRAP_SERVERS: &bootstrap kafka-1:19092,kafka-2:19092,kafka-3:19092
  DATABASE_URL: "${DATABASE_URL:-postgresql://ddia:${POSTGRES_PASSWORD:-ddia-local-only}@postgres:5432/ddia}"

x-app: &app
  image: ddia-hw2-app:local
  build: .
  init: true
  stop_grace_period: 20s
  depends_on:
    topic_init:
      condition: service_completed_successfully
    schema_init:
      condition: service_completed_successfully

x-producer: &producer
  <<: *app
  command: ["python", "-m", "app.producer"]

x-producer-environment: &producer-environment
  <<: *app-environment
  KEY_MODE: "${KEY_MODE:-user_id}"
  USERS_PER_PRODUCER: "${USERS_PER_PRODUCER:-2}"
  PRODUCE_INTERVAL_MS: "${PRODUCE_INTERVAL_MS:-150}"
  POISON_RATE: "${POISON_RATE:-0.02}"

x-consumer: &consumer
  <<: *app
  command: ["python", "-m", "app.consumer"]

services:
  kafka-1:
    <<: *kafka
    ports:
      - "127.0.0.1:29092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:29092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka
    ports:
      - "127.0.0.1:39092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:39092
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka
    ports:
      - "127.0.0.1:49092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:49092
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  topic_init:
    <<: *kafka
    entrypoint: ["/bin/sh", "/init/create_topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *bootstrap
      KAFKA_HEAP_OPTS: -Xms64m -Xmx256m
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    volumes:
      - type: bind
        source: ./scripts/create_topics.sh
        target: /init/create_topics.sh
        read_only: true
        bind:
          create_host_path: false

  postgres:
    image: &postgres-image postgres:16.10-alpine
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: ddia
      POSTGRES_USER: ddia
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ddia-local-only}"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "ddia", "-d", "ddia"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  schema_init:
    image: *postgres-image
    entrypoint: ["psql"]
    command:
      - --host=postgres
      - --username=ddia
      - --dbname=ddia
      - --single-transaction
      - --set=ON_ERROR_STOP=1
      - --file=/init/schema.sql
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:-ddia-local-only}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./db/schema.sql
        target: /init/schema.sql
        read_only: true
        bind:
          create_host_path: false

  producer-1:
    <<: *producer
    environment:
      <<: *producer-environment
      PRODUCER_ID: p1

  producer-2:
    <<: *producer
    environment:
      <<: *producer-environment
      PRODUCER_ID: p2

  producer-3:
    <<: *producer
    environment:
      <<: *producer-environment
      PRODUCER_ID: p3

  consumer-1:
    <<: *consumer
    environment:
      <<: *app-environment
      CONSUMER_ID: c1
      PROCESSING_DELAY_MS: "${C1_PROCESSING_DELAY_MS:-200}"

  consumer-2:
    <<: *consumer
    environment:
      <<: *app-environment
      CONSUMER_ID: c2
      PROCESSING_DELAY_MS: "${C2_PROCESSING_DELAY_MS:-60}"

  consumer-3:
    <<: *consumer
    environment:
      <<: *app-environment
      CONSUMER_ID: c3
      PROCESSING_DELAY_MS: "${C3_PROCESSING_DELAY_MS:-60}"

  verify:
    <<: *app
    profiles: ["tools"]
    entrypoint: ["python", "-m", "app.verify"]
    environment:
      <<: *app-environment
      GITHUB_LOGIN: "${GITHUB_LOGIN:-Len1viy}"

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  postgres-data:
