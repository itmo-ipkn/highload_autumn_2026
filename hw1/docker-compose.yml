name: highload-hw-1
services:
  service-1:
    build: ./service
    environment:
      POD_ID: 1
      DATACENTER: center-1
    ports:
      - 8081:8080
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  service-2:
    build: ./service
    environment:
      POD_ID: 2
      DATACENTER: center-2
    ports:
      - 8082:8080
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - 9090:9090
    mem_limit: 1g
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      PROMETHEUS_UID: ${PROMETHEUS_UID}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: curl --fail -s http://localhost:3001/ || exit 1
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 768m
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging
    depends_on:
      - prometheus

  dashboard-generator:
    build: 
      context: ./scripts/cli
      dockerfile: Dockerfile
    image: dashboard-generator:local
    environment:
      GRAFANA_UID: ${GRAFANA_UID}
      PROMETHEUS_UID: ${PROMETHEUS_UID}
      DIR_DASHBOARD: ${DIR_DASHBOARD}
    command:
      - "--uri=http://service-1:8080/handlers"
      - "--refresh=5s"
    volumes:
      - ./grafana/dashboards:${DIR_DASHBOARDS}
    depends_on:
      service-1:
        condition: service_healthy
      service-2:
        condition: service_healthy
      grafana:
        condition: service_healthy
    restart: "no"
    logging: *logging

volumes:
  prometheus-data:
  grafana-data:
