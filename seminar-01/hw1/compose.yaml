name: hw1
services:
  app1:
    build: ./app
    environment:
      POD_ID: app1
      DATACENTER: dc-a
      ERROR_RATE: "0.05"
      PORT: "8090"
    ports: ["127.0.0.1:8090:8090"]
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  app2:
    build: ./app
    environment:
      POD_ID: app2
      DATACENTER: dc-b
      ERROR_RATE: "0.05"
      PORT: "8090"
    ports: ["127.0.0.1:8091:8090"]
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Copy .env.example to .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Copy .env.example to .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  generator:
    build: ./tools
    command: ["python", "generate_dashboard.py"]
    environment:
      GRAFANA_URL: http://grafana:3000
      APP_URL: http://app1:8090
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Copy .env.example to .env}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Copy .env.example to .env}
      DATASOURCE_UID: hw1-prom
    depends_on:
      app1: {condition: service_healthy}
      grafana: {condition: service_healthy}
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    logging: *logging

  load:
    build: ./tools
    command: ["python", "load.py"]
    environment:
      INSTANCE_URLS: http://app1:8090,http://app2:8090
      TARGET_RPS: "35"
      RAMP_SECONDS: "120"
    depends_on:
      app1: {condition: service_healthy}
      app2: {condition: service_healthy}
      generator: {condition: service_completed_successfully}
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    logging: *logging

volumes:
  prometheus-data:
  grafana-data:
