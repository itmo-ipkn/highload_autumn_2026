global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: app
    static_configs:
      - targets: [app:8080]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  # Optional Linux host profile. DOWN here is expected when --profile host is absent.
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
