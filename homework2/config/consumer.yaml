components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 2
    fs-task-processor:
      worker_threads: 1
    consumer-task-processor:
      thread_name: consumer
      worker_threads: 1
    consumer-blocking-task-processor:
      thread_name: cons-blocking
      worker_threads: 1
  default_task_processor: main-task-processor
  components:
    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stderr'
          level: info
    secdist: {}
    default-secdist-provider:
      config: /app/homework/config/secdist.json
    dns-client:
      fs-task-processor: fs-task-processor
    testsuite-support: {}
    postgres-sink:
      dbconnection: postgresql://homework:homework@postgres:5432/kafka_homework
      blocking_task_processor: fs-task-processor
      dns_resolver: async
    kafka-consumer:
      security_protocol: PLAINTEXT
      group_id: events-smoke
      topics: [events]
      auto_offset_reset: earliest
      max_batch_size: 1
    event-sink: {}
