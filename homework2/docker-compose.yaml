name: homework2

x-kafka: &kafka
  image: apache/kafka:4.1.1

x-pipeline: &pipeline
  profiles: [pipeline]
  image: localhost/homework2-events:local
  platform: linux/amd64
  stop_grace_period: 45s

x-producer: &producer
  <<: *pipeline
  command: [homework-producer, --config, config/producer.yaml]
  depends_on:
    kafka-init:
      condition: service_completed_successfully
  environment: &producer-env
    # Keep x86-64 userspace addresses below the 48-bit canonical boundary under QEMU.
    QEMU_GUEST_BASE: '0x800000000000'
    PRODUCER_ID: '1'
    EVENTS_PER_SECOND: '${EVENTS_PER_SECOND:-10}'
    KEY_MODE: '${KEY_MODE:-user_id}'

x-consumer: &consumer
  <<: *pipeline
  command: [homework-consumer, --config, config/consumer.yaml]
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
  environment: &consumer-env
    QEMU_GUEST_BASE: '0x800000000000'
    CONSUMER_ID: '1'
    PROCESSING_DELAY_MS: '${PROCESSING_DELAY_MS:-20}'

x-broker: &broker
  <<: *kafka
  environment: &broker-env
    CLUSTER_ID: 'A6YSPILcRo6bWsqLn50KGQ'
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'

services:
  kafka-1:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: '1'
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:29092
    ports:
      - '127.0.0.1:29092:9092'
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: '2'
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:39092
    ports:
      - '127.0.0.1:39092:9092'
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: '3'
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:49092
    ports:
      - '127.0.0.1:49092:9092'
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  kafka-init:
    <<: *kafka
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    restart: 'no'
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        bootstrap=kafka-1:19092,kafka-2:19092,kafka-3:19092
        admin_config=/tmp/kafka-init.properties
        printf '%s\n' 'default.api.timeout.ms=10000' 'request.timeout.ms=5000' > "$$admin_config"

        create_topic() {
          local attempt
          for attempt in {1..12}; do
            if /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$bootstrap" \
                --command-config "$$admin_config" --create --if-not-exists \
                --partitions 3 --replication-factor 3 "$$@"; then
              return 0
            fi
            echo "Topic creation failed (attempt $$attempt of 12): $$*" >&2
            sleep 2
          done
          return 1
        }

        create_topic --topic events --config min.insync.replicas=2
        create_topic --topic events.dlt
        echo 'Kafka topics are ready.'

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kafka_homework
      POSTGRES_USER: homework
      POSTGRES_PASSWORD: homework
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, homework, -d, kafka_homework]
      interval: 5s
      timeout: 3s
      retries: 12

  producer:
    <<: *producer
    build: .

  producer-2:
    <<: *producer
    environment:
      <<: *producer-env
      PRODUCER_ID: '2'

  producer-3:
    <<: *producer
    environment:
      <<: *producer-env
      PRODUCER_ID: '3'

  consumer:
    <<: *consumer

  consumer-2:
    <<: *consumer
    environment:
      <<: *consumer-env
      CONSUMER_ID: '2'

  consumer-3:
    <<: *consumer
    environment:
      <<: *consumer-env
      CONSUMER_ID: '3'

  verify:
    <<: *pipeline
    profiles: [tools]
    command: [/usr/local/bin/verify]
    environment:
      QEMU_GUEST_BASE: '0x800000000000'
      GITHUB_LOGIN: '${GITHUB_LOGIN:-}'
      TZ: Europe/Moscow

  kafka-exporter:
    profiles: [monitoring]
    image: docker.io/danielqsj/kafka-exporter:v1.10.0
    restart: on-failure
    command:
      - --kafka.server=kafka-1:19092
      - --kafka.server=kafka-2:19092
      - --kafka.server=kafka-3:19092
      - --kafka.version=4.1.0
      - '--topic.filter=^events$'
      - '--group.filter=^events-processor$'
      - --refresh.metadata=4s

  blackbox-exporter:
    profiles: [monitoring]
    image: docker.io/prom/blackbox-exporter:v0.26.0

  prometheus:
    profiles: [monitoring]
    image: docker.io/prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    profiles: [monitoring]
    image: docker.io/grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kafka.json
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  postgres-data:
  prometheus-data:
