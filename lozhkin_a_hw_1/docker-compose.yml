services:
  app1:
    build: ./app
    environment:
      POD_ID: "1"
      DATACENTER: dc1
      FAIL_RATE: ${FAIL_RATE:-0.05}
    ports:
      - "8081:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app2:
    build: ./app
    environment:
      POD_ID: "2"
      DATACENTER: dc2
      FAIL_RATE: ${FAIL_RATE:-0.05}
    ports:
      - "8082:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.45.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  dashboard-generator:
    build: ./scripts
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env}
      APP_URLS: http://app1:8000,http://app2:8000
      DATASOURCE_UID: prometheus
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      grafana:
        condition: service_healthy
      prometheus:
        condition: service_started
    restart: "no"

  load-generator:
    build: ./scripts
    command: ["python", "load_test.py"]
    environment:
      TARGET_URLS: http://app1:8000,http://app2:8000
      TARGET_RPS: ${TARGET_RPS:-30}
      RAMP_UP_SECONDS: ${RAMP_UP_SECONDS:-120}
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      dashboard-generator:
        condition: service_completed_successfully
    restart: "no"

volumes:
  grafana-data:
